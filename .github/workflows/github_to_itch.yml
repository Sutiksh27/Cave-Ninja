name: Publish CaveNinja to Itch.io

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GODOT_VERSION: 4.7.2
  ITCH_TARGET: sutiksh27/cave-ninja:html5  # itch.io user/game:channel

jobs:
  Export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot and web export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          # Only the web templates are needed from the ~1.3 GB bundle
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz "templates/web_*" "templates/version.txt" -d "$dest"
          rm godot.zip templates.tpz

      - name: Import assets
        # A fresh checkout has no .godot/ import cache, so build it before exporting
        run: ~/godot/godot --headless --path . --import

      - name: Export Web
        run: |
          mkdir -p exports/web
          ~/godot/godot --headless --path . --export-release "Web" exports/web/index.html
          test -f exports/web/index.pck

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: exports/web
          retention-days: 3

  Release:
    needs: Export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the version tag and create the release
    outputs:
      version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Tag
        if: ${{ !steps.tag_version.outputs.new_tag }}
        run: exit 1

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: exports/web

      - name: Zip
        run: cd exports && zip -qr ../release-${{ steps.tag_version.outputs.new_tag }}.zip web

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: release-${{ steps.tag_version.outputs.new_tag }}.zip

  Publish:
    needs: Release
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}  # add under repo Settings > Secrets > Actions
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web

      - name: Push to itch.io
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret is not set, skipping the itch.io upload"
            exit 0
          fi
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V
          ./butler push web "$ITCH_TARGET" --userversion "${{ needs.Release.outputs.version }}"
